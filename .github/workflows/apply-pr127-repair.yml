name: Apply PR127 repair packet

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  apply:
    if: >-
      github.event.pull_request.number == 127 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'chatgpt/production-ready/genemap-discovery'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Apply exact repair packet
        shell: bash
        run: |
          set -euo pipefail
          cat .release/pr127-repair/chunk.* > /tmp/pr127.patch.gz.b64
          echo '9cc221d28288ab0573b479c448c9dfbdaa20f0aa733acecff77b1f5ad60e86cd  /tmp/pr127.patch.gz.b64' | sha256sum --check --strict
          base64 --decode /tmp/pr127.patch.gz.b64 | gzip --decompress > /tmp/pr127.patch
          echo 'a4c6dadbb93bdca63f1882b6fd9383de246f6d118b4429497e9f867f58ba2a0e  /tmp/pr127.patch' | sha256sum --check --strict
          patch --batch --forward -p1 < /tmp/pr127.patch
          sed -i 's/[[:blank:]]\+$//' docs/PROCESSOR_REGISTER.md
          rm -rf .release/pr127-repair
          rm -f .github/workflows/apply-pr127-repair.yml
          git config user.name 'ChatGPT release executor'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix(release): close GeneMap billing, provenance, and restore blockers'
          git push origin HEAD:${{ github.head_ref }}
