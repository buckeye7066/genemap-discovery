name: Railway Deploy Monitor

# Proves that the Railway deployment and the live API both correspond to the
# exact main-branch commit. Newer unrelated deployments cannot satisfy this
# check, and a healthy-but-stale API remains a deployment failure.

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Install pinned Railway CLI
        run: npm install --global @railway/cli@5.40.0
      - name: Verify exact deployment and live release identity
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE: genemap-api
          API_URL: https://genemap-api-production.up.railway.app
          GITHUB_SHA: ${{ github.sha }}
        run: node scripts/monitor-railway-deployment.mjs
