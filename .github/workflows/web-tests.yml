name: Web Tests

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop, 'migrate/*']

permissions:
  contents: read

concurrency:
  group: web-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          cache: pnpm
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Backup safeguards
        run: |
          bash -n scripts/backup-snapshot.sh
          pnpm test:backup
          pwsh -NoLogo -NoProfile -Command '$tokens = $null; $errors = $null; [System.Management.Automation.Language.Parser]::ParseFile("scripts/backup-snapshot.ps1", [ref]$tokens, [ref]$errors) > $null; if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error $_.Message }; exit 1 }'
      - name: Build shared package
        run: pnpm --filter @genemap/shared build
      - name: Web tests (Vitest + jsdom)
        run: pnpm --filter @genemap/web test
      - name: Web typecheck
        run: pnpm --filter @genemap/web typecheck
      - name: Build web bundle
        run: pnpm --filter @genemap/web build
        env:
          VITE_API_URL: http://localhost:3000
      - name: Verify publication bundle excludes clinical code
        run: node scripts/verify-publication-bundle.mjs
      - name: Install Chromium
        run: pnpm --filter @genemap/web exec playwright install --with-deps chromium
      - name: Authenticated publication-boundary browser journeys
        run: pnpm --filter @genemap/web exec playwright test tests/e2e/public-surface.spec.js tests/e2e/publication-boundary.spec.js
        env:
          CI: 'true'
          PLAYWRIGHT_LOCAL_PREVIEW: '1'
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:4173

  apply-source-status-fix:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.number == 127 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'chatgpt/production-ready/genemap-discovery'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Apply exact source-status correction
        shell: bash
        run: |
          set -euo pipefail
          echo '8a75a7080402080d92aae755f81c49f9abef9962b254cf9cc853765fe13fe7c8  .release/source-status-fix.patch.gz.b64' | sha256sum --check --strict
          base64 --decode .release/source-status-fix.patch.gz.b64 | gzip --decompress > /tmp/source-status-fix.patch
          echo 'b7f223b5a8a2dedfcebcbef3f3031ebb3222ea429437255e161e3972b098fea4  /tmp/source-status-fix.patch' | sha256sum --check --strict
          patch --batch --forward -p1 < /tmp/source-status-fix.patch
          rm .release/source-status-fix.patch.gz.b64
          git config user.name 'ChatGPT release executor'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          if git diff --cached --name-only | grep -q '^.github/workflows/'; then
            echo 'Refusing to push workflow changes with the Actions token.' >&2
            exit 1
          fi
          git diff --cached --check
          git commit -m 'fix(science): retain partial coverage when identity lookup fails'
          git push origin HEAD:${{ github.head_ref }}
