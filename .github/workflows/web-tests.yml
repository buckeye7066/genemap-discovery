name: Web Tests

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop, 'migrate/*']

permissions:
  contents: read

concurrency:
  group: web-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          cache: pnpm
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Build shared package
        run: pnpm --filter @genemap/shared build
      - name: Verify workflow trust boundary
        run: node scripts/verify-publication-workflows.mjs
      - name: Web tests (Vitest + jsdom)
        run: pnpm --filter @genemap/web test
      - name: Web typecheck
        run: pnpm --filter @genemap/web typecheck
      - name: Backup and restore contract (static)
        run: node scripts/verify-backup-contract.mjs
      - name: Build web bundle
        run: pnpm --filter @genemap/web build
        env:
          VITE_API_URL: http://localhost:3000
      - name: Verify publication bundle excludes clinical code
        run: node scripts/verify-publication-bundle.mjs
      - name: Verify publication artifact route graph and truth labels
        run: node scripts/verify-publication-artifacts.mjs apps/web/dist
      - name: Install Chromium for exact-artifact user journeys
        run: pnpm --filter @genemap/web exec playwright install --with-deps chromium
      - name: Run public and authenticated publication journeys against exact built artifact
        run: >-
          pnpm --filter @genemap/web exec playwright test
          tests/e2e/public-surface.spec.js
          tests/e2e/publication-boundary.spec.js
        env:
          CI: 'true'
          PLAYWRIGHT_LOCAL_PREVIEW: '1'
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:4173
