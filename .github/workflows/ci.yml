name: CI

on:
  push:
    branches: [main, develop, 'migrate/*']
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Test-only env so the API/test setup files do not throw at import time.
  # Production secrets are NEVER set in CI.
  JWT_SECRET: ci-jwt-secret-at-least-32-characters-long
  JWT_REFRESH_SECRET: ci-jwt-refresh-secret-at-least-32-chars-long
  COOKIE_SECRET: ci-cookie-secret-at-least-32-chars-long
  CORS_ORIGINS: 'http://localhost:5173'
  NODE_ENV: test
  LOG_LEVEL: silent

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Verify reviewed security exceptions
        run: node scripts/verify-security-exceptions.mjs
      - name: Build shared package
        # @genemap/shared resolves via dist/*.d.ts (its package "types"/"exports"
        # point at ./dist). Without this, `pnpm typecheck` fails with TS2307
        # "Cannot find module '@genemap/shared'" on web imports of it.
        run: pnpm --filter @genemap/shared build
      - name: Lint (web + api)
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck

  verify-migrations:
    # Hard-fail the pipeline if a refactor accidentally re-ignores or wipes
    # the prisma migrations folder. Without this, a missing migration would
    # only surface at deploy time when `prisma migrate deploy` runs.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Migrations directory present
        run: test -d services/api/prisma/migrations
      - name: At least one migration.sql exists
        run: |
          count=$(find services/api/prisma/migrations -name migration.sql | wc -l)
          echo "Found $count migration.sql files"
          test "$count" -gt 0
      - name: migration_lock.toml exists
        run: test -f services/api/prisma/migrations/migration_lock.toml

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm db:generate
      - name: Build shared package
        run: pnpm --filter @genemap/shared build
      - name: API tests (vitest)
        run: pnpm test:api
      - name: Shared tests (vitest)
        run: pnpm test:shared

  api-integration-postgres:
    runs-on: ubuntu-latest
    needs: [verify-migrations]
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: genemap
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/genemap
      TEST_DB: postgres
      STRIPE_SECRET_KEY: sk_test_mock
      STRIPE_WEBHOOK_SECRET: whsec_test
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm db:generate
      - name: Apply migrations
        run: pnpm db:migrate:deploy
      - name: API integration tests (Postgres)
        run: pnpm test:api:integration

  build-web:
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test, api-integration-postgres]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Build shared package
        run: pnpm --filter @genemap/shared build
      - name: Build web bundle
        run: pnpm build:web
        env:
          VITE_API_URL: http://localhost:3000
      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: apps/web/dist
          retention-days: 7

  desktop-build-smoke:
    # electron-builder is part of the shipped desktop toolchain. Build an unpacked
    # Linux directory on every PR so a dependency/security upgrade cannot silently
    # break packaging while web and API CI remain green.
    runs-on: ubuntu-latest
    needs: [build-web]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Build shared package
        run: pnpm --filter @genemap/shared build
      - name: Build web bundle for desktop resources
        run: pnpm build:web
        env:
          VITE_API_URL: http://localhost:3000
      - name: Generate desktop icons
        run: pnpm --filter @genemap/desktop run build:icons
      - name: Build unpacked desktop application
        working-directory: apps/desktop
        run: node scripts/electron-build.mjs --dir
      - name: Verify desktop output exists
        run: test -d apps/desktop/dist-electron/linux-unpacked

  docker-build-api:
    # Build the API image we ship to Railway, on the same commit. Without
    # this, lockfile drift, missing build deps, or a broken Dockerfile only
    # surface in production.
    runs-on: ubuntu-latest
    needs: [verify-migrations]
    steps:
      - uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build API image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: services/api/Dockerfile
          push: false
          load: true
          tags: genemap-api:ci

  migration-smoke:
    # Spin up Postgres and run `prisma migrate deploy` against it on every
    # PR. Catches drift between schema.prisma and the committed migrations
    # before it reaches production.
    runs-on: ubuntu-latest
    needs: [verify-migrations]
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: genemap
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/genemap
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm --filter @genemap/api db:generate
      - name: Apply migrations
        run: pnpm --filter @genemap/api db:migrate:deploy
      - name: Verify schema matches migrations
        run: |
          cd services/api
          npx prisma migrate diff \
            --from-schema-datasource prisma/schema.prisma \
            --to-schema-datamodel prisma/schema.prisma \
            --exit-code

  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Dependency audit with reviewed exception guard
        run: pnpm run audit
