name: CI

on:
  push:
    branches: [main, develop, 'migrate/*']
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Test-only env so the API/test setup files do not throw at import time.
  # Production secrets are NEVER set in CI.
  JWT_SECRET: ci-jwt-secret-at-least-32-characters-long
  JWT_REFRESH_SECRET: ci-jwt-refresh-secret-at-least-32-chars-long
  COOKIE_SECRET: ci-cookie-secret-at-least-32-chars-long
  CORS_ORIGINS: 'http://localhost:5173'
  NODE_ENV: test
  LOG_LEVEL: silent

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          cache: 'pnpm'
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Verify reviewed security exceptions
        run: node scripts/verify-security-exceptions.mjs
      - name: Build shared package
        # @genemap/shared resolves via dist/*.d.ts (its package "types"/"exports"
        # point at ./dist). Without this, `pnpm typecheck` fails with TS2307
        # "Cannot find module '@genemap/shared'" on web imports of it.
        run: pnpm --filter @genemap/shared build
      - name: Lint (web + api)
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck

  verify-migrations:
    # Hard-fail the pipeline if a refactor accidentally re-ignores or wipes
    # the prisma migrations folder. Without this, a missing migration would
    # only surface at deploy time when `prisma migrate deploy` runs.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Migrations directory present
        run: test -d services/api/prisma/migrations
      - name: At least one migration.sql exists
        run: |
          count=$(find services/api/prisma/migrations -name migration.sql | wc -l)
          echo "Found $count migration.sql files"
          test "$count" -gt 0
      - name: migration_lock.toml exists
        run: test -f services/api/prisma/migrations/migration_lock.toml

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          cache: 'pnpm'
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm db:generate
      - name: Build shared package
        run: pnpm --filter @genemap/shared build
      - name: API tests (vitest)
        run: pnpm test:api
      - name: Shared tests (vitest)
        run: pnpm test:shared
      - name: Account-closure ledger contract tests (node:test)
        # Drives the real API ledger client against the real ops/closure-ledger
        # server, so a change to either side's HMAC/idempotency contract fails
        # here instead of in production account deletion.
        run: pnpm test:ledger

  api-integration-postgres:
    runs-on: ubuntu-latest
    needs: [verify-migrations]
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: genemap
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/genemap
      TEST_DB: postgres
      STRIPE_SECRET_KEY: sk_test_mock
      STRIPE_WEBHOOK_SECRET: whsec_test
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          cache: 'pnpm'
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm db:generate
      - name: Build shared package
        run: pnpm --filter @genemap/shared build
      - name: Apply migrations
        run: pnpm db:migrate:deploy
      - name: API integration tests (Postgres)
        run: pnpm test:api:integration

  build-web:
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test, api-integration-postgres]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          cache: 'pnpm'
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Build shared package
        run: pnpm --filter @genemap/shared build
      - name: Build web bundle
        run: pnpm build:web
        env:
          VITE_API_URL: http://localhost:3000
      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: apps/web/dist
          retention-days: 7

  android-build-smoke:
    # PR/push-safe native packaging proof: no signing credentials, and the OTA
    # update FEED is never baked into the package. The app can fetch a verified
    # web bundle at runtime (apps/web/lib/mobileUpdater.js), but the feed and
    # its zips are a deploy artifact published by scripts/build-mobile-bundle.mjs
    # into the Vercel output — the archive-reject check below keeps them out of
    # the APK. The unset version env exercises local defaults.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: 'pnpm'
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Build shared package
        run: pnpm --filter @genemap/shared build
      - name: Build web bundle for Android assets
        run: pnpm --filter @genemap/web build
        env:
          VITE_API_URL: http://localhost:3000
      - name: Verify Java 21
        shell: bash
        run: |
          set -euo pipefail
          java -version
          JAVA_SPEC=$(java -XshowSettings:properties -version 2>&1 | awk -F'= ' '/java.specification.version/{print $2; exit}')
          test "$JAVA_SPEC" = '21'
      - name: Sync Capacitor Android project
        run: npx -y @capacitor/cli@8.4.1 sync android
        working-directory: apps/web
      - name: Assemble Android debug APK without release credentials
        run: ./gradlew assembleDebug --no-daemon
        working-directory: apps/web/android
      - name: Inspect Android package identity, content, and size
        shell: bash
        run: |
          set -euo pipefail
          APK='apps/web/android/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"

          AAPT=$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name aapt | sort -V | tail -n 1)
          test -n "$AAPT"
          "$AAPT" dump badging "$APK" | tee "$RUNNER_TEMP/genemap-apk-badging.txt"
          grep -F "package: name='com.genemap.discovery' versionCode='1' versionName='1.0'" \
            "$RUNNER_TEMP/genemap-apk-badging.txt"

          unzip -Z1 "$APK" | tee "$RUNNER_TEMP/genemap-apk-files.txt"
          test "$(grep -Fxc 'assets/public/index.html' "$RUNNER_TEMP/genemap-apk-files.txt")" -eq 1
          ARCHIVE_REJECT_PATTERN='^assets/public/mobile/|\.zip$'
          for rejected_path in \
            'assets/public/mobile/manifest.json' \
            'assets/public/ota.zip' \
            'assets/public/OTA.ZIP' \
            'assets/public/nested/cache/archive.Zip'; do
            if ! printf '%s\n' "$rejected_path" | grep -Eiq "$ARCHIVE_REJECT_PATTERN"; then
              echo "Archive reject pattern missed: $rejected_path" >&2
              exit 1
            fi
          done
          if grep -Eiq "$ARCHIVE_REJECT_PATTERN" "$RUNNER_TEMP/genemap-apk-files.txt"; then
            echo 'Unexpected mobile OTA directory or ZIP archive found in Android package' >&2
            exit 1
          fi

          APK_BYTES=$(stat -c '%s' "$APK")
          test "$APK_BYTES" -gt 0
          {
            echo '### Android debug package smoke'
            echo
            echo "- Package: com.genemap.discovery"
            echo "- Version: 1 / 1.0 (local defaults)"
            echo "- APK bytes: $APK_BYTES"
            echo '- Baked web entrypoints: 1'
            echo '- Mobile OTA archives: 0'
            echo '- Packaged ZIP files: 0'
          } >> "$GITHUB_STEP_SUMMARY"

  desktop-build-smoke:
    # electron-builder is part of the shipped desktop toolchain. Build an unpacked
    # Linux directory on every PR so a dependency/security upgrade cannot silently
    # break packaging while web and API CI remain green.
    runs-on: ubuntu-latest
    needs: [build-web]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          cache: 'pnpm'
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Build shared package
        run: pnpm --filter @genemap/shared build
      - name: Build web bundle for desktop resources
        run: pnpm build:web
        env:
          VITE_API_URL: http://localhost:3000
      - name: Generate desktop icons
        run: pnpm --filter @genemap/desktop run build:icons
      - name: Build unpacked desktop application
        working-directory: apps/desktop
        run: node scripts/electron-build.mjs --dir
      - name: Verify desktop output exists
        run: test -d apps/desktop/dist-electron/linux-unpacked

  desktop-build-windows-smoke:
    # Build the actual unsigned NSIS installer on Windows. This catches peer,
    # Squirrel/NSIS, path, icon, and packaging failures that a Linux --dir build
    # cannot exercise.
    runs-on: windows-latest
    needs: [build-web]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          cache: 'pnpm'
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Verify Windows builder packages are aligned
        shell: pwsh
        run: |
          $builder = node -p "require('./node_modules/electron-builder/package.json').version"
          $squirrel = node -p "require('./node_modules/electron-builder-squirrel-windows/package.json').version"
          Write-Host "electron-builder=$builder squirrel=$squirrel"
          if ($builder -ne $squirrel) {
            throw "electron-builder and electron-builder-squirrel-windows must use the same version"
          }
      - name: Build shared package
        run: pnpm --filter @genemap/shared build
      - name: Build web bundle for desktop resources
        run: pnpm build:web
        env:
          VITE_API_URL: http://localhost:3000
      - name: Generate desktop icons
        run: pnpm --filter @genemap/desktop run build:icons
      - name: Build unsigned Windows NSIS installer
        working-directory: apps/desktop
        run: node scripts/electron-build.mjs --win --publish never
      - name: Verify Windows installer exists
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path apps/desktop/dist-electron -Filter *.exe -File | Select-Object -First 1
          if (-not $installer) {
            throw "No Windows installer was produced"
          }
          Write-Host "Built $($installer.FullName)"

  desktop-build-macos-smoke:
    # Build a real unpacked macOS Electron bundle at the exact PR head. This
    # deliberately disables identity discovery; signing and notarization are
    # trusted release operations, not properties of this CI artifact.
    name: Build unsigned macOS desktop application
    runs-on: macos-15
    needs: [build-web]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact requested source
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'pnpm'
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Build shared package
        run: pnpm --filter @genemap/shared build
      - name: Build web bundle for desktop resources
        run: pnpm build:web
        env:
          VITE_API_URL: http://localhost:3000
      - name: Generate desktop icons
        run: pnpm --filter @genemap/desktop run build:icons
      - name: Build unpacked macOS application
        working-directory: apps/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: node scripts/electron-build.mjs --mac --dir --publish never
      - name: Verify bundle, binary identity, and absence of distribution signing
        run: |
          set -euo pipefail
          OUTPUT="$GITHUB_WORKSPACE/apps/desktop/dist-electron"
          APP_COUNT=$(find "$OUTPUT" -type d -name 'GeneMap Discovery.app' | wc -l | tr -d '[:space:]')
          test "$APP_COUNT" = '1'
          APP=$(find "$OUTPUT" -type d -name 'GeneMap Discovery.app' -print -quit)
          PLIST="$APP/Contents/Info.plist"
          test -f "$PLIST"
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$PLIST")
          EXECUTABLE=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$PLIST")
          test "$BUNDLE_ID" = 'com.genemap.discovery'
          test "$EXECUTABLE" = 'GeneMap Discovery'
          BINARY="$APP/Contents/MacOS/$EXECUTABLE"
          test -x "$BINARY"
          file "$BINARY" | tee "$RUNNER_TEMP/genemap-macos-binary.txt"
          grep -q 'Mach-O' "$RUNNER_TEMP/genemap-macos-binary.txt"

          SIGNING_STATUS='unsigned'
          if codesign --display --verbose=4 "$APP" 2> "$RUNNER_TEMP/genemap-macos-codesign.txt"; then
            SIGNING_STATUS='ad-hoc/no-distribution-authority'
          fi
          if grep -q '^Authority=' "$RUNNER_TEMP/genemap-macos-codesign.txt"; then
            echo 'CI macOS artifact unexpectedly has a distribution signing authority' >&2
            cat "$RUNNER_TEMP/genemap-macos-codesign.txt" >&2
            exit 1
          fi

          ARCHIVE="$RUNNER_TEMP/GeneMap-macos-unsigned.zip"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$ARCHIVE"
          test -s "$ARCHIVE"
          zipinfo -1 "$ARCHIVE" > "$RUNNER_TEMP/genemap-macos-files.txt"
          grep -Fx 'GeneMap Discovery.app/Contents/Info.plist' "$RUNNER_TEMP/genemap-macos-files.txt"
          grep -Fx 'GeneMap Discovery.app/Contents/MacOS/GeneMap Discovery' "$RUNNER_TEMP/genemap-macos-files.txt"
          {
            echo "source_sha=$(git rev-parse HEAD)"
            echo "bundle_id=$BUNDLE_ID"
            echo "executable=$EXECUTABLE"
            echo 'package=unpacked-electron-app'
            echo "signing=$SIGNING_STATUS"
            echo 'notarization=not-performed'
            echo "archive_bytes=$(stat -f '%z' "$ARCHIVE")"
            echo "archive_sha256=$(shasum -a 256 "$ARCHIVE" | awk '{print $1}')"
          } | tee "$RUNNER_TEMP/genemap-macos-unsigned-evidence.txt"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: genemap-macos-unsigned
          path: |
            ${{ runner.temp }}/GeneMap-macos-unsigned.zip
            ${{ runner.temp }}/genemap-macos-unsigned-evidence.txt
          if-no-files-found: error
          retention-days: 7

  docker-build-api:
    # Build the API image we ship to Railway, on the same commit. Without
    # this, lockfile drift, missing build deps, or a broken Dockerfile only
    # surface in production.
    runs-on: ubuntu-latest
    needs: [verify-migrations]
    steps:
      - uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build API image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: services/api/Dockerfile
          push: false
          load: true
          tags: genemap-api:ci

  migration-smoke:
    # Spin up Postgres and run `prisma migrate deploy` against it on every
    # PR. Catches drift between schema.prisma and the committed migrations
    # before it reaches production.
    runs-on: ubuntu-latest
    needs: [verify-migrations]
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: genemap
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/genemap
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          cache: 'pnpm'
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm --filter @genemap/api db:generate
      - name: Apply migrations
        run: pnpm --filter @genemap/api db:migrate:deploy
      - name: Verify schema matches migrations
        run: |
          cd services/api
          npx prisma migrate diff \
            --from-schema-datasource prisma/schema.prisma \
            --to-schema-datamodel prisma/schema.prisma \
            --exit-code

  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          cache: 'pnpm'
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Dependency audit with reviewed exception guard
        run: pnpm run audit
