name: Android build and repo-direct release

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'packages/**'
      - 'scripts/**'
      - 'pnpm-lock.yaml'
      - 'package.json'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

env:
  ANDROID_VERSION_CODE: ${{ github.run_number }}
  ANDROID_VERSION_NAME: 1.0.${{ github.run_number }}

jobs:
  android:
    name: Build signed APK + AAB
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Release gates
        run: pnpm release:check
      - name: Build and verify production-configured web app
        env:
          VITE_API_URL: https://genemap-api-production.up.railway.app
        run: |
          pnpm --filter @genemap/shared build
          pnpm --filter @genemap/web build
          node scripts/verify-publication-bundle.mjs
      - name: Sync Capacitor
        run: npx -y @capacitor/cli@8.4.1 sync android
        working-directory: apps/web
      - name: Require persistent Android signing identity
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo 'ANDROID_KEYSTORE_BASE64 is missing'; exit 1; }
          test -n "$ANDROID_KEYSTORE_PASSWORD" || { echo 'ANDROID_KEYSTORE_PASSWORD is missing'; exit 1; }
          test -n "$ANDROID_KEY_ALIAS" || { echo 'ANDROID_KEY_ALIAS is missing'; exit 1; }
          test -n "$ANDROID_KEY_PASSWORD" || { echo 'ANDROID_KEY_PASSWORD is missing'; exit 1; }
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
      - name: Build signed release APK and AAB
        run: ./gradlew assembleRelease bundleRelease --no-daemon
        working-directory: apps/web/android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/upload.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_VERSION_CODE: ${{ env.ANDROID_VERSION_CODE }}
          ANDROID_VERSION_NAME: ${{ env.ANDROID_VERSION_NAME }}
      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          APK='apps/web/android/app/build/outputs/apk/release/app-release.apk'
          AAB='apps/web/android/app/build/outputs/bundle/release/app-release.aab'
          test -f "$APK"
          test -f "$AAB"
          cp "$APK" "GeneMap-${ANDROID_VERSION_NAME}.apk"
          cp "$AAB" "GeneMap-${ANDROID_VERSION_NAME}.aab"
          sha256sum "GeneMap-${ANDROID_VERSION_NAME}.apk" > genemap-android.sha256
      - uses: actions/upload-artifact@v7
        with:
          name: genemap-signed-android
          path: |
            GeneMap-*.apk
            GeneMap-*.aab
            genemap-android.sha256
          if-no-files-found: error

  publish:
    name: Publish repo-direct Android release
    needs: android
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: genemap-signed-android
      - name: Publish GitHub Release for phone updater
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="android-v${ANDROID_VERSION_NAME}"
          NOTES="Automated signed Android release from main at ${GITHUB_SHA}. Package com.genemap.discovery. Intended for repo-direct phone updates; Android requires the same signing certificate as the installed copy."
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            TARGET=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json targetCommitish --jq .targetCommitish)
            test "$TARGET" = "$GITHUB_SHA" || { echo "Existing $TAG targets $TARGET, expected $GITHUB_SHA"; exit 1; }
            gh release upload "$TAG" \
              "GeneMap-${ANDROID_VERSION_NAME}.apk" \
              "GeneMap-${ANDROID_VERSION_NAME}.aab" \
              genemap-android.sha256 \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
            gh release edit "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "GeneMap Android ${ANDROID_VERSION_NAME}" \
              --notes "$NOTES" \
              --draft=false
          else
            gh release create "$TAG" \
              "GeneMap-${ANDROID_VERSION_NAME}.apk" \
              "GeneMap-${ANDROID_VERSION_NAME}.aab" \
              genemap-android.sha256 \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "GeneMap Android ${ANDROID_VERSION_NAME}" \
              --notes "$NOTES"
          fi
