name: Refresh security lockfile once

on:
  push:
    branches:
      - agent/genemap-rate-limit-fallback

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/genemap-rate-limit-fallback
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'
      - name: Refresh resolutions from the reviewed manifests
        run: pnpm install --no-frozen-lockfile
      - name: Ensure installation did not rewrite manifests
        run: git diff --exit-code -- package.json apps/desktop/package.json
      - name: Commit the refreshed lockfile
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "Lockfile is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore(deps): refresh lockfile for security overrides"
          git push origin HEAD:agent/genemap-rate-limit-fallback
