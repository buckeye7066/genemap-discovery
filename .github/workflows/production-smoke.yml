name: Production Smoke

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * *'

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('production-smoke-pr-{0}', github.event.pull_request.number) || 'production-smoke-prod' }}
  cancel-in-progress: true

env:
  API_URL: https://genemap-api-production.up.railway.app
  WEB_URL: https://genemap-discovery.vercel.app

jobs:
  smoke:
    name: Live health, readiness, CORS, and web shell
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Wait for exact API and web release
        # Pull requests do not have an API preview. Every production event must
        # prove the deployed API and web identities before exercising journeys;
        # otherwise a scheduled green run can accidentally certify stale code.
        if: github.event_name != 'pull_request'
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: node scripts/wait-for-live-release.mjs

      - name: Check API liveness
        run: |
          body="$(curl --fail --silent --show-error --max-time 15 "$API_URL/healthz")"
          BODY="$body" node -e '
            const body = JSON.parse(process.env.BODY);
            if (body.status !== "ok") {
              throw new Error(`/healthz expected status ok, got ${JSON.stringify(body)}`);
            }
          '

      - name: Check API readiness and publication boundary
        run: |
          body="$(curl --fail --silent --show-error --max-time 15 "$API_URL/readyz")"
          BODY="$body" node -e '
            const body = JSON.parse(process.env.BODY);
            if (
              body.status !== "ready" ||
              body.publicationMode !== "education_research" ||
              body.medicalEncryption !== true
            ) {
              throw new Error(
                `/readyz expected ready, publicationMode=education_research, and medicalEncryption=true; got ${JSON.stringify(body)}`
              );
            }
          '

      - name: Check disabled clinical API paths
        run: |
          node --input-type=module <<'NODE'
          const baseUrl = process.env.API_URL.replace(/\/+$/, '');
          const probes = [
            { method: 'GET', path: '/clinical-trials/search?gene=BRCA1' },
            { method: 'POST', path: '/genomics/vcf/parse', body: {} },
            { method: 'GET', path: '/genomics/variant/search?q=rs123' },
            { method: 'GET', path: '/genomics/clinvar/search?q=BRCA1' },
            { method: 'GET', path: '/admin/self-test' },
          ];

          for (const probe of probes) {
            const response = await fetch(`${baseUrl}${probe.path}`, {
              method: probe.method,
              headers: probe.body ? { 'content-type': 'application/json' } : undefined,
              body: probe.body ? JSON.stringify(probe.body) : undefined,
              signal: AbortSignal.timeout(15_000),
            });
            const raw = await response.text();
            let body;
            try {
              body = JSON.parse(raw);
            } catch {
              throw new Error(`${probe.method} ${probe.path} returned non-JSON: ${raw.slice(0, 200)}`);
            }
            if (
              response.status !== 404 ||
              body.code !== 'FEATURE_NOT_AVAILABLE' ||
              body.publicationMode !== 'education_research'
            ) {
              throw new Error(
                `${probe.method} ${probe.path} escaped the publication boundary: ` +
                `${response.status} ${JSON.stringify(body)}`
              );
            }
          }
          NODE

      - name: Check enabled private health and assistant paths
        run: |
          node --input-type=module <<'NODE'
          const baseUrl = process.env.API_URL.replace(/\/+$/, '');
          const probes = [
            { method: 'GET', path: '/entities/medical-data' },
            { method: 'GET', path: '/entities/conversations' },
            {
              method: 'POST',
              path: '/assistants/anastasia/chat',
              body: { message: 'Verify the authentication boundary.', recordIds: [] },
            },
          ];

          for (const probe of probes) {
            const response = await fetch(`${baseUrl}${probe.path}`, {
              method: probe.method,
              headers: probe.body ? { 'content-type': 'application/json' } : undefined,
              body: probe.body ? JSON.stringify(probe.body) : undefined,
              signal: AbortSignal.timeout(15_000),
            });
            const raw = await response.text();
            let body;
            try {
              body = JSON.parse(raw);
            } catch {
              throw new Error(`${probe.method} ${probe.path} returned non-JSON: ${raw.slice(0, 200)}`);
            }
            if (response.status !== 401 || body.error !== 'Authentication required') {
              throw new Error(
                `${probe.method} ${probe.path} did not enforce its live private route: `
                + `${response.status} ${JSON.stringify(body)}`
              );
            }
          }
          NODE

      - name: Check production CORS for web origin
        run: |
          headers="$(mktemp)"
          curl --fail --silent --show-error --max-time 15 \
            --output /dev/null \
            --dump-header "$headers" \
            --request OPTIONS \
            --header "Origin: $WEB_URL" \
            --header "Access-Control-Request-Method: GET" \
            "$API_URL/healthz"
          grep -Fi "access-control-allow-origin: $WEB_URL" "$headers"
          grep -Fi "access-control-allow-credentials: true" "$headers"

      - name: Check API security headers
        run: |
          headers="$(mktemp)"
          curl --fail --silent --show-error --max-time 15 \
            --output /dev/null --dump-header "$headers" "$API_URL/healthz"
          # helmet should set these on every API response.
          grep -Fi "strict-transport-security:" "$headers"
          grep -Fi "x-content-type-options: nosniff" "$headers"
          grep -Fi "x-frame-options:" "$headers"

      - name: Check web security headers
        run: |
          headers="$(mktemp)"
          curl --fail --silent --show-error --location --max-time 20 \
            --output /dev/null --dump-header "$headers" "$WEB_URL"
          grep -Fi "strict-transport-security:" "$headers"
          grep -Fi "x-content-type-options: nosniff" "$headers"

      - name: Check web app shell
        run: |
          html="$(curl --fail --silent --show-error --location --max-time 20 "$WEB_URL")"
          case "$html" in
            *'<title>GeneMap Discovery | Genetics Education &amp; Research Leads</title>'*'<div id="root"'*) ;;
            *)
              echo "Web app did not return the expected GeneMap HTML shell."
              exit 1
              ;;
          esac

  # Browser-level production smoke runs only for a deployed release. A pull
  # request has no API preview, so running the PR's forward-looking assertions
  # against the older production API creates an impossible red gate: neither
  # result says anything truthful about the candidate. Exact-head PR browser
  # coverage lives in Web Tests and CI; the post-merge push waits for this SHA
  # to be deployed before this disposable-account journey can certify it.
  e2e:
    name: E2E (public + authenticated, Chromium)
    if: github.event_name != 'pull_request'
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'pnpm'
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm --filter @genemap/web exec playwright install --with-deps chromium
      - name: Recheck exact API and web release before browser journey
        if: github.event_name != 'pull_request'
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: node scripts/wait-for-live-release.mjs
      - name: Run production e2e in Chromium
        run: pnpm --filter @genemap/web exec playwright test --project=desktop-chromium
        env:
          CI: 'true'
          PLAYWRIGHT_BASE_URL: ${{ env.WEB_URL }}
          PLAYWRIGHT_API_URL: ${{ env.API_URL }}
