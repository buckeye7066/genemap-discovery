name: Production Smoke

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: read

concurrency:
  group: production-smoke
  cancel-in-progress: true

env:
  API_URL: https://genemap-api-production.up.railway.app
  WEB_URL: https://genemap-discovery.vercel.app

jobs:
  smoke:
    name: Live health, readiness, CORS, and web shell
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'

      - name: Check API liveness
        run: |
          node --input-type=module <<'NODE'
          const response = await fetch(`${process.env.API_URL}/healthz`, {
            redirect: 'error',
            signal: AbortSignal.timeout(15_000),
          });
          const body = await response.json();
          if (response.status !== 200 || body.status !== 'ok') {
            throw new Error(
              `/healthz expected 200 status ok, got ${response.status} ${JSON.stringify(body)}`
            );
          }
          NODE

      - name: Check API readiness and publication boundary
        run: |
          node --input-type=module <<'NODE'
          const response = await fetch(`${process.env.API_URL}/readyz`, {
            redirect: 'error',
            signal: AbortSignal.timeout(15_000),
          });
          const body = await response.json();
          if (
            response.status !== 200 ||
            body.status !== 'ready' ||
            body.publicationMode !== 'education_research' ||
            body.medicalEncryption !== true
          ) {
            throw new Error(
              `/readyz expected 200 ready, publicationMode=education_research, and medicalEncryption=true; got ${response.status} ${JSON.stringify(body)}`
            );
          }
          NODE

      - name: Check coordinated web and API release identity
        run: |
          node --input-type=module <<'NODE'
          import { extractWebReleaseSha } from './scripts/lib/release-identity.mjs';

          const [apiResponse, webResponse] = await Promise.all([
            fetch(`${process.env.API_URL}/readyz`, {
              redirect: 'error',
              signal: AbortSignal.timeout(15_000),
            }),
            fetch(process.env.WEB_URL, {
              redirect: 'error',
              signal: AbortSignal.timeout(20_000),
            }),
          ]);
          const api = await apiResponse.json();
          const webHtml = await webResponse.text();
          const webSha = extractWebReleaseSha(webHtml);
          if (apiResponse.status !== 200 || !/^[a-f0-9]{40}$/u.test(api.releaseSha || '')) {
            throw new Error(
              `API readiness is missing an immutable release SHA: ${apiResponse.status} ${JSON.stringify(api)}`
            );
          }
          if (webResponse.status !== 200 || !webSha) {
            throw new Error(
              `Web shell must return 200 with one unambiguous immutable release SHA marker; got ${webResponse.status}`
            );
          }
          if (webSha !== api.releaseSha) {
            throw new Error(
              `Web/API release skew: web=${webSha} api=${api.releaseSha}`
            );
          }
          NODE

      - name: Check disabled clinical API paths
        run: |
          node --input-type=module <<'NODE'
          const baseUrl = process.env.API_URL.replace(/\/+$/, '');
          const probes = [
            { method: 'GET', path: '/clinical-trials/search?gene=BRCA1' },
            { method: 'POST', path: '/genomics/vcf/parse', body: {} },
            { method: 'GET', path: '/genomics/variant/search?q=rs123' },
            { method: 'GET', path: '/genomics/clinvar/search?q=BRCA1' },
            { method: 'GET', path: '/entities/medical-data' },
            { method: 'GET', path: '/entities/conversations' },
            { method: 'GET', path: '/admin/self-test' },
          ];

          for (const probe of probes) {
            const response = await fetch(`${baseUrl}${probe.path}`, {
              method: probe.method,
              headers: probe.body ? { 'content-type': 'application/json' } : undefined,
              body: probe.body ? JSON.stringify(probe.body) : undefined,
              signal: AbortSignal.timeout(15_000),
              redirect: 'error',
            });
            const raw = await response.text();
            let body;
            try {
              body = JSON.parse(raw);
            } catch {
              throw new Error(`${probe.method} ${probe.path} returned non-JSON: ${raw.slice(0, 200)}`);
            }
            if (
              response.status !== 404 ||
              body.code !== 'FEATURE_NOT_AVAILABLE' ||
              body.publicationMode !== 'education_research'
            ) {
              throw new Error(
                `${probe.method} ${probe.path} escaped the publication boundary: ` +
                `${response.status} ${JSON.stringify(body)}`
              );
            }
          }
          NODE

      - name: Check production CORS for web origin
        run: |
          node --input-type=module <<'NODE'
          const response = await fetch(`${process.env.API_URL}/healthz`, {
            method: 'OPTIONS',
            headers: {
              origin: process.env.WEB_URL,
              'access-control-request-method': 'GET',
            },
            redirect: 'error',
            signal: AbortSignal.timeout(15_000),
          });
          if (![200, 204].includes(response.status)) {
            throw new Error(`CORS preflight expected 200/204, got ${response.status}`);
          }
          if (response.headers.get('access-control-allow-origin') !== process.env.WEB_URL) {
            throw new Error('CORS preflight did not return the exact production web origin.');
          }
          if (response.headers.get('access-control-allow-credentials') !== 'true') {
            throw new Error('CORS preflight did not allow credentials.');
          }
          NODE

      - name: Check API security headers
        run: |
          node --input-type=module <<'NODE'
          const response = await fetch(`${process.env.API_URL}/healthz`, {
            redirect: 'error',
            signal: AbortSignal.timeout(15_000),
          });
          if (response.status !== 200) throw new Error(`API security probe got ${response.status}`);
          if (!response.headers.get('strict-transport-security')) throw new Error('API HSTS missing.');
          if (response.headers.get('x-content-type-options') !== 'nosniff') {
            throw new Error('API nosniff header missing.');
          }
          if (!response.headers.get('x-frame-options')) throw new Error('API frame header missing.');
          NODE

      - name: Check web security headers
        run: |
          node --input-type=module <<'NODE'
          const response = await fetch(process.env.WEB_URL, {
            redirect: 'error',
            signal: AbortSignal.timeout(20_000),
          });
          if (response.status !== 200) throw new Error(`Web security probe got ${response.status}`);
          if (!response.headers.get('strict-transport-security')) throw new Error('Web HSTS missing.');
          if (response.headers.get('x-content-type-options') !== 'nosniff') {
            throw new Error('Web nosniff header missing.');
          }
          NODE

      - name: Check web app shell
        run: |
          node --input-type=module <<'NODE'
          const response = await fetch(process.env.WEB_URL, {
            redirect: 'error',
            signal: AbortSignal.timeout(20_000),
          });
          const html = await response.text();
          if (
            response.status !== 200 ||
            !html.includes('<title>GeneMap Discovery | Genetics Education &amp; Research Leads</title>') ||
            !html.includes('<div id="root"')
          ) {
            throw new Error(`Web app did not return the expected 200 GeneMap HTML shell; got ${response.status}`);
          }
          NODE

  # Browser-level smoke: renders the deployed app in Chromium and asserts the
  # public/auth surface (login form, legal pages, redirects, headers) actually
  # works for a logged-out visitor — things a curl shell check can't see.
  e2e:
    name: E2E (public surface, Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          cache: 'pnpm'
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm --filter @genemap/web exec playwright install --with-deps chromium
      - name: Run public and boundary e2e against production
        run: pnpm --filter @genemap/web e2e
        env:
          CI: 'true'
          PLAYWRIGHT_BASE_URL: ${{ env.WEB_URL }}
          PLAYWRIGHT_API_URL: ${{ env.API_URL }}
